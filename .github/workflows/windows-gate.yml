name: windows-gate

# The acceptance gate for "在 Windows 上双击就能用".
#
# It runs on the self-hosted Windows node (label set regrevia-win), not on a
# hosted windows-latest image: the point is to prove the artifact on the same
# class of machine as the users. Never wire pull_request to this workflow — a
# public repository would then execute fork code on that machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: windows-gate
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: node facts
        shell: powershell
        run: |
          Write-Host "::add-mask::$env:USERNAME"
          Write-Host "::add-mask::$env:COMPUTERNAME"
          Write-Host "runner=$env:RUNNER_NAME"
          (Get-CimInstance Win32_OperatingSystem) | ForEach-Object { Write-Host "os_build=$($_.BuildNumber) ram_gb=$([math]::Round($_.TotalVisibleMemorySize/1MB,1))" }
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            Write-Host "nvidia_smi=present"
            (& nvidia-smi --query-gpu=index,name,driver_version,memory.total --format=csv,noheader 2>&1) | Write-Host
          } else {
            Write-Host "nvidia_smi=absent (this node verifies packaging and process layer, not GPU telemetry)"
          }

      # 不能用 oven-sh/setup-bun：它以 NetworkService 身份运行时会做 symlink，
      # 而这台机器没开开发者模式 -> EPERM。改成自己解析 bun.exe，不依赖符号链接。
      - name: resolve bun
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $bun = $null

          $onPath = Get-Command bun.exe -ErrorAction SilentlyContinue
          if ($onPath) { $bun = $onPath.Source; Write-Host "bun: already on PATH" }

          if (-not $bun) {
            Write-Host "bun: installing from the npm registry"
            New-Item -ItemType Directory -Path .bun-tool -Force | Out-Null
            npm install --prefix .bun-tool bun@latest --no-audit --no-fund 2>&1 | Write-Host
            $bun = (Get-ChildItem -Path .bun-tool -Recurse -Filter bun.exe -File -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          }

          if (-not $bun) {
            Write-Host "bun: registry route failed, trying the release CDN"
            New-Item -ItemType Directory -Path .bun-tool -Force | Out-Null
            $zip = Join-Path $env:TEMP "bun-windows-x64.zip"
            $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
            for ($i = 1; $i -le 4 -and -not $bun; $i++) {
              & curl.exe -fsSL --retry 3 --retry-all-errors --connect-timeout 30 -o $zip $url
              if ($LASTEXITCODE -eq 0) {
                Expand-Archive -LiteralPath $zip -DestinationPath .bun-tool -Force
                $bun = (Get-ChildItem -Path .bun-tool -Recurse -Filter bun.exe -File |
                        Select-Object -First 1).FullName
              } else {
                Write-Host ("download attempt {0} failed" -f $i)
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          if (-not $bun) { throw "could not obtain bun.exe" }
          Write-Host "bun=$bun"
          Write-Host ("bun_version={0}" -f (& $bun --version))
          "BUN_EXE=$bun" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path bun.lock) { & $env:BUN_EXE install --frozen-lockfile } else { & $env:BUN_EXE install }
          if ($LASTEXITCODE -ne 0) { throw "bun install failed" }

      - name: test
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem -Recurse -File -Include *.test.ts,*.spec.ts -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if (-not $tests) { Write-Host "::notice::no test files yet"; exit 0 }
          & $env:BUN_EXE test
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: compile single exe
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $env:BUN_EXE build --compile --minify --target=bun-windows-x64 --outfile dist/gpulease.exe src/main.ts
          if ($LASTEXITCODE -ne 0) { throw "bun build failed" }
          $f = Get-Item dist/gpulease.exe
          Write-Host ("exe_bytes={0} size_mb={1}" -f $f.Length, [math]::Round($f.Length/1MB,1))

      - name: smoke test the exe
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # A single-file exe must not need node on PATH.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'nodejs|nvm|npm' }) -join ';'
          $exe = (Resolve-Path dist/gpulease.exe).Path

          $v = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          Write-Host "version=$($v.Trim())"

          # No GPU on this node: the daemon must degrade honestly, not crash.
          $doc = & $exe doctor --json 2>&1 | Out-String
          Write-Host $doc
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }
          $null = $doc | ConvertFrom-Json

          $ls = & $exe ls --json 2>&1 | Out-String
          Write-Host $ls
          if ($LASTEXITCODE -ne 0) { throw "ls exited $LASTEXITCODE" }
          $parsed = $ls | ConvertFrom-Json
          if ($null -eq $parsed) { throw "ls --json did not produce JSON" }

          # This node has no NVIDIA card: the contract is an honest degraded report, not a fake one.
          $docObj = $doc | ConvertFrom-Json
          if ($docObj.nvidia_smi -ne "absent") { throw "expected nvidia_smi=absent on a GPU-less node, got $($docObj.nvidia_smi)" }
          if (-not $docObj.notes -or $docObj.notes.Count -lt 1) { throw "degraded report must say why" }

          # The run wrapper is the product: spawn a real child, record it, pass the exit code through.
          $runOut = & $exe run --name smoke -- powershell -NoProfile -Command "Write-Output hello-from-child" 2>&1 | Out-String
          Write-Host $runOut
          if ($LASTEXITCODE -ne 0) { throw "run exited $LASTEXITCODE" }
          if ($runOut -notmatch "hello-from-child") { throw "child stdout was not teed to the console" }

          $after = & $exe ls --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "ls after run exited $LASTEXITCODE" }
          $parsedAfter = $after | ConvertFrom-Json
          $task = $parsedAfter.tasks | Where-Object { $_.run.name -eq "smoke" } | Select-Object -First 1
          if (-not $task) { throw "ls --json does not contain the run we just started" }
          if ($task.run.exit_code -ne 0) { throw "recorded exit_code=$($task.run.exit_code), expected 0" }
          if ($task.verdict -ne "ok") { throw "a cleanly finished run should judge ok, got $($task.verdict)" }

          # A failing child must be reported, not swallowed.
          & $exe run --name smoke-fail -- powershell -NoProfile -Command "exit 7" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 7) { throw "child exit code 7 was not passed through (got $LASTEXITCODE)" }
          Write-Host "smoke=ok"

      - name: checksum
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $h = (Get-FileHash dist/gpulease.exe -Algorithm SHA256).Hash.ToLower()
          "$h  gpulease.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt | Write-Host

      - name: measure ship size
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $exe = (Resolve-Path dist/gpulease.exe).Path
          Compress-Archive -Path $exe -DestinationPath dist/gpulease-windows-x64.zip -Force
          $z = Get-Item dist/gpulease-windows-x64.zip
          Write-Host ("zip_bytes={0} zip_mb={1}" -f $z.Length, [math]::Round($z.Length/1MB,1))

      - name: upload artifact
        if: hashFiles('package.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gpulease-windows-x64
          path: |
            dist/gpulease.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: scaffold only
        if: hashFiles('package.json') == ''
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: Write-Host "no package.json yet - the gate has nothing to build"

  release:
    needs: build-and-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpulease-windows-x64
          path: dist

      - name: publish release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          Get-Content dist/SHA256SUMS.txt | Write-Host
          gh release create $tag dist/gpulease.exe dist/SHA256SUMS.txt --title $tag --notes "unsigned; verify SHA256 before running" --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
