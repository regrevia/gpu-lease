name: windows-gate

# The acceptance gate for "在 Windows 上双击就能用".
#
# It runs on the self-hosted Windows node (label set regrevia-win), not on a
# hosted windows-latest image: the point is to prove the artifact on the same
# class of machine as the users. Never wire pull_request to this workflow — a
# public repository would then execute fork code on that machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  # 一个仓库一条队列，但按 ref 分开：tag 的发布作业不能被随后的 main push 顶掉
  # （实测：共用组时，排在后面的 tag 运行会在没有作业的情况下被取消）。
  # 机器上只有一个 runner，真正的串行由 runner 自己保证。
  group: windows-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: [self-hosted, windows, x64, regrevia-win]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: node facts
        shell: powershell
        run: |
          Write-Host "::add-mask::$env:USERNAME"
          Write-Host "::add-mask::$env:COMPUTERNAME"
          Write-Host "runner=$env:RUNNER_NAME"
          (Get-CimInstance Win32_OperatingSystem) | ForEach-Object { Write-Host "os_build=$($_.BuildNumber) ram_gb=$([math]::Round($_.TotalVisibleMemorySize/1MB,1))" }
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            Write-Host "nvidia_smi=present"
            (& nvidia-smi --query-gpu=index,name,driver_version,memory.total --format=csv,noheader 2>&1) | Write-Host
          } else {
            Write-Host "nvidia_smi=absent (this node verifies packaging and process layer, not GPU telemetry)"
          }

      # 不能用 oven-sh/setup-bun：它以 NetworkService 身份运行时会做 symlink，
      # 而这台机器没开开发者模式 -> EPERM。改成自己解析 bun.exe，不依赖符号链接。
      - name: resolve bun
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $bun = $null

          $onPath = Get-Command bun.exe -ErrorAction SilentlyContinue
          if ($onPath) { $bun = $onPath.Source; Write-Host "bun: already on PATH" }

          if (-not $bun) {
            Write-Host "bun: installing from the npm registry"
            New-Item -ItemType Directory -Path .bun-tool -Force | Out-Null
            npm install --prefix .bun-tool bun@latest --no-audit --no-fund 2>&1 | Write-Host
            $bun = (Get-ChildItem -Path .bun-tool -Recurse -Filter bun.exe -File -ErrorAction SilentlyContinue |
                    Select-Object -First 1).FullName
          }

          if (-not $bun) {
            Write-Host "bun: registry route failed, trying the release CDN"
            New-Item -ItemType Directory -Path .bun-tool -Force | Out-Null
            $zip = Join-Path $env:TEMP "bun-windows-x64.zip"
            $url = "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
            for ($i = 1; $i -le 4 -and -not $bun; $i++) {
              & curl.exe -fsSL --retry 3 --retry-all-errors --connect-timeout 30 -o $zip $url
              if ($LASTEXITCODE -eq 0) {
                Expand-Archive -LiteralPath $zip -DestinationPath .bun-tool -Force
                $bun = (Get-ChildItem -Path .bun-tool -Recurse -Filter bun.exe -File |
                        Select-Object -First 1).FullName
              } else {
                Write-Host ("download attempt {0} failed" -f $i)
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }

          if (-not $bun) { throw "could not obtain bun.exe" }
          Write-Host "bun=$bun"
          Write-Host ("bun_version={0}" -f (& $bun --version))
          "BUN_EXE=$bun" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: install
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path bun.lock) { & $env:BUN_EXE install --frozen-lockfile } else { & $env:BUN_EXE install }
          if ($LASTEXITCODE -ne 0) { throw "bun install failed" }

      - name: test
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tests = Get-ChildItem -Recurse -File -Include *.test.ts,*.spec.ts -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\node_modules\\' }
          if (-not $tests) { Write-Host "::notice::no test files yet"; exit 0 }
          & $env:BUN_EXE test
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: compile single exe
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $env:BUN_EXE build --compile --minify --target=bun-windows-x64 --outfile dist/gpulease.exe src/main.ts
          if ($LASTEXITCODE -ne 0) { throw "bun build failed" }
          $f = Get-Item dist/gpulease.exe
          Write-Host ("exe_bytes={0} size_mb={1}" -f $f.Length, [math]::Round($f.Length/1MB,1))

      - name: smoke test the exe
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # A single-file exe must not need node on PATH.
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -notmatch 'nodejs|nvm|npm' }) -join ';'
          $exe = (Resolve-Path dist/gpulease.exe).Path

          $v = & $exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "--version exited $LASTEXITCODE" }
          Write-Host "version=$($v.Trim())"

          # No GPU on this node: the daemon must degrade honestly, not crash.
          $doc = & $exe doctor --json 2>&1 | Out-String
          Write-Host $doc
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }
          $null = $doc | ConvertFrom-Json

          $ls = & $exe ls --json 2>&1 | Out-String
          Write-Host $ls
          if ($LASTEXITCODE -ne 0) { throw "ls exited $LASTEXITCODE" }
          $parsed = $ls | ConvertFrom-Json
          if ($null -eq $parsed) { throw "ls --json did not produce JSON" }

          # This node has no NVIDIA card: the contract is an honest degraded report, not a fake one.
          $docObj = $doc | ConvertFrom-Json
          if ($docObj.nvidia_smi -ne "absent") { throw "expected nvidia_smi=absent on a GPU-less node, got $($docObj.nvidia_smi)" }
          if (-not $docObj.notes -or $docObj.notes.Count -lt 1) { throw "degraded report must say why" }
          Write-Host "process_layer=$($docObj.wmi) detail=$($docObj.wmi_detail)"

          # The run wrapper is the product: spawn a real child, record it, pass the exit code through.
          $runOut = & $exe run --name smoke -- powershell -NoProfile -Command "Write-Output hello-from-child" 2>&1 | Out-String
          Write-Host $runOut
          if ($LASTEXITCODE -ne 0) { throw "run exited $LASTEXITCODE" }
          if ($runOut -notmatch "hello-from-child") { throw "child stdout was not teed to the console" }

          $after = & $exe ls --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "ls after run exited $LASTEXITCODE" }
          $parsedAfter = $after | ConvertFrom-Json
          $task = $parsedAfter.tasks | Where-Object { $_.run.name -eq "smoke" } | Select-Object -First 1
          if (-not $task) { throw "ls --json does not contain the run we just started" }
          if ($task.run.exit_code -ne 0) { throw "recorded exit_code=$($task.run.exit_code), expected 0" }
          if ($task.verdict -ne "ok") { throw "a cleanly finished run should judge ok, got $($task.verdict)" }

          # 会话归属：显式 --session 必须原样落进 ls --json；没有就写 null，不编。
          & $exe run --name smoke-sess --session gate-sess -- powershell -NoProfile -Command "exit 0" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "run --session exited $LASTEXITCODE" }
          $sessState = ((& $exe ls --json 2>&1) | Out-String) | ConvertFrom-Json
          $sessTask = $sessState.tasks | Where-Object { $_.run.name -eq "smoke-sess" } | Select-Object -First 1
          if (-not $sessTask) { throw "ls --json does not contain smoke-sess" }
          if ($sessTask.run.session -ne "gate-sess") { throw "session recorded as [$($sessTask.run.session)], expected gate-sess" }

          & $exe run --name smoke-nosess -- powershell -NoProfile -Command "exit 0" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "run without --session exited $LASTEXITCODE" }
          $noSess = (((& $exe ls --json 2>&1) | Out-String) | ConvertFrom-Json).tasks | Where-Object { $_.run.name -eq "smoke-nosess" } | Select-Object -First 1
          if (-not $noSess) { throw "ls --json does not contain smoke-nosess" }
          if ($null -ne $noSess.run.session) { throw "session should be null without --session, got [$($noSess.run.session)]" }

          # 会话汇总：排队中的任务也要按会话出现在 sessions --json 里，人读输出带短名。
          & $exe submit --name sess-q --session gate-sess -- cmd /c exit 0 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "submit --session exited $LASTEXITCODE" }
          $sessRows = ((& $exe sessions --json 2>&1) | Out-String) | ConvertFrom-Json
          $sessRow = $sessRows | Where-Object { $_.session -eq "gate-sess" } | Select-Object -First 1
          if (-not $sessRow) { throw "sessions --json does not contain gate-sess" }
          if ($sessRow.queued -lt 1) { throw "sessions --json queued=$($sessRow.queued), expected at least 1" }
          $sessHuman = & $exe sessions --no-color 2>&1 | Out-String
          if ($sessHuman -notmatch "gate-ses") { throw "sessions human output does not show the session label" }
          $queuedJob = ((& $exe queue --json 2>&1) | Out-String) | ConvertFrom-Json | Where-Object { $_.name -eq "sess-q" } | Select-Object -First 1
          if ($queuedJob) { & $exe cancel $queuedJob.id 2>&1 | Out-Null }
          if ($LASTEXITCODE -ne 0) { throw "cancel sess-q exited $LASTEXITCODE" }

          # A failing child must be reported, not swallowed.
          & $exe run --name smoke-fail -- powershell -NoProfile -Command "exit 7" 2>&1 | Out-Null
          $failCode = $LASTEXITCODE
          if ($failCode -ne 7) { throw "child exit code 7 was not passed through (got $failCode)" }

          # 让这一步自己的退出码干净：runner 会把最后一个 native 退出码当步骤结果。
          $global:LASTEXITCODE = 0
          Write-Host "smoke=ok"

      # 信息性一步：进程层采不到时，把每条子进程路径的耗时/退出码打出来，便于定位。
      # continue-on-error：诊断信息不该把门禁变红。
      - name: install / uninstall on real Windows（装进去、从 PATH 里敲、再卸干净）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $root = Join-Path $env:RUNNER_TEMP "gpulease-install-test"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue }
          $bin = Join-Path $root "bin"
          $env:GPULEASE_HOME = Join-Path $root "home"
          $before = [Environment]::GetEnvironmentVariable('PATH','User')
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          try {
            # 1) 装
            $out = & $exe install --dir $bin --autostart --json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "install 退出码 $LASTEXITCODE`n$out" }
            $j = $out | ConvertFrom-Json
            if ($j.exe -ne (Join-Path $bin 'gpulease.exe')) { throw "装到哪不对：$($j.exe)" }
            if (-not (Test-Path $j.exe)) { throw "exe 不在：$($j.exe)" }
            if (-not (Test-Path $j.shortcut)) { throw "开始菜单快捷方式没建：$($j.shortcut)" }
            $userPath = [Environment]::GetEnvironmentVariable('PATH','User')
            $hit = @($userPath -split ';' | Where-Object { $_.Trim().ToLower() -eq $bin.ToLower() })
            if ($hit.Count -ne 1) { throw "用户 PATH 里 $bin 出现 $($hit.Count) 次" }
            $run = (Get-ItemProperty -Path $runKey -Name 'gpulease' -ErrorAction SilentlyContinue).gpulease
            if (-not $run -or $run -notlike '*daemon --quiet*') { throw "自启项不对：$run" }
            Write-Host "install: exe=$($j.exe) shortcut=$($j.shortcut) run=$run"

            # 2) 再装一次：不重复加 PATH（升级路径）
            $out2 = & $exe install --dir $bin --autostart --json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "第二次 install 退出码 $LASTEXITCODE`n$out2" }
            $n = @([Environment]::GetEnvironmentVariable('PATH','User') -split ';' | Where-Object { $_.Trim().ToLower() -eq $bin.ToLower() }).Count
            if ($n -ne 1) { throw "重装后 PATH 里重复了 $n 次" }

            # 3) 装好的那份自己跑得起来
            $ls = & $j.exe ls --json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "装好的 exe 跑不起来：$ls" }
            $parsed = $ls | ConvertFrom-Json
            if ($null -eq $parsed.gpus) { throw "装好的 exe 输出不对：$ls" }

            # 4) 卸
            $un = & $exe uninstall --dir $bin --purge --json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "uninstall 退出码 $LASTEXITCODE`n$un" }
            if (Test-Path $j.exe) { throw "卸完 exe 还在：$($j.exe)" }
            if (Test-Path $j.shortcut) { throw "卸完快捷方式还在" }
            $runAfter = (Get-ItemProperty -Path $runKey -Name 'gpulease' -ErrorAction SilentlyContinue).gpulease
            if ($runAfter) { throw "卸完自启项还在：$runAfter" }
            $pathAfter = [Environment]::GetEnvironmentVariable('PATH','User')
            if ($pathAfter -split ';' | Where-Object { $_.Trim().ToLower() -eq $bin.ToLower() }) { throw "卸完 PATH 里还有 $bin" }
            # 装的时候会顺手去掉尾分号（PATH 里不留空段），所以只把尾巴上的分号抹平再比，其余要一模一样。
            $beforeStr = ([string]$before).Trim().TrimEnd(';')
            $afterStr = ([string]$pathAfter).Trim().TrimEnd(';')
            if ($afterStr -ne $beforeStr) { throw "卸完用户 PATH 没回到原样：装之前是「$beforeStr」，卸完是「$afterStr」" }
            Write-Host "install/uninstall: 装 → 重装不重复 → 跑 → 卸干净，全过"
          } finally {
            # 失败也别把注册表和 PATH 留脏
            Remove-ItemProperty -Path $runKey -Name 'gpulease' -ErrorAction SilentlyContinue
            [Environment]::SetEnvironmentVariable('PATH', $before, 'User')
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
          }

      - name: gpu scenarios against the exe（这台节点没有 NVIDIA 卡）
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # 节点上没有 NVIDIA 显卡：把 nvidia-smi 换成替身，验"有卡时"的整条链路。
          # 这是本仓库唯一能在真 Windows 上验多卡/断联/驱动报错的办法。
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $fixture = (Resolve-Path test/fixture/smi.ts).Path
          if ($env:BUN_EXE -match "\s" -or $fixture -match "\s") {
            throw "GPULEASE_SMI 用空格切参数，路径不能含空格：$env:BUN_EXE | $fixture"
          }
          $env:GPULEASE_SMI = "$env:BUN_EXE $fixture"
          # 假数据写进临时状态目录，别和真 smoke 记录混在一起。
          $env:GPULEASE_HOME = Join-Path $env:RUNNER_TEMP "gpulease-fake-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $env:GPULEASE_HOME | Out-Null

          function Get-State([string]$scenario) {
            $env:GPULEASE_SMI_SCENARIO = $scenario
            $raw = & $exe ls --json 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "ls --json ($scenario) exited $LASTEXITCODE" }
            return $raw | ConvertFrom-Json
          }

          # 1) 双卡异型号：两张卡各读各的，不串味
          $two = Get-State "two-gpu"
          if ($two.gpus.Count -ne 2) { throw "two-gpu: expected 2 cards, got $($two.gpus.Count)" }
          if ($two.gpus[0].name -notmatch "4090") { throw "two-gpu: card 0 is $($two.gpus[0].name)" }
          if ($two.gpus[1].name -notmatch "4060") { throw "two-gpu: card 1 is $($two.gpus[1].name)" }
          if ($two.gpus[0].vram_total_mb -ne 24564 -or $two.gpus[1].vram_total_mb -ne 8188) { throw "two-gpu: vram totals crossed" }
          if ($two.gpus[0].uuid -eq $two.gpus[1].uuid) { throw "two-gpu: cards share a uuid" }
          Write-Host "two-gpu: 2 cards, 4090 + 4060, uuid distinct"

          # 2) 单卡机器不许凭空多一张
          $one = Get-State "single"
          if ($one.gpus.Count -ne 1) { throw "single: expected 1 card, got $($one.gpus.Count)" }

          # 3) 无卡：状态必须说 absent，不许假装 present
          $none = Get-State "absent"
          if ($none.nvidia -ne "absent") { throw "absent: nvidia=$($none.nvidia)" }

          # 4) 驱动连不上：error，并把驱动原话带出来
          $err = Get-State "error"
          if ($err.nvidia -ne "error") { throw "error: nvidia=$($err.nvidia)" }
          if (($err.degraded -join " ") -notmatch "communicate") { throw "error: driver message lost" }

          # 5) 卡在、按进程表读不到：卡数据保留，进程表为空，不崩
          $lost = Get-State "lost"
          if ($lost.gpus.Count -ne 2) { throw "lost: cards should still be readable" }
          if ($null -ne $lost.procs -and $lost.procs.Count -ne 0) { throw "lost: procs should be empty" }

          # 6) WDDM 下按进程显存是 [N/A]：上层必须留 null，不许编数字
          $full = Get-State "two-gpu"
          foreach ($p in $full.procs) { if ($null -ne $p.vram_mb) { throw "per-process vram must stay null on WDDM, got $($p.vram_mb)" } }

          # 7) 人读的那一行也得有卡名
          $env:GPULEASE_SMI_SCENARIO = "two-gpu"
          $text = & $exe ls --no-color 2>&1 | Out-String
          if ($text -notmatch "RTX 4090") { throw "ls --no-color lost the card name" }

          # 8) doctor 必须说明数据来自替身，不能把假数据当真卡
          $doc = & $exe doctor --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE" }
          $docObj = $doc | ConvertFrom-Json
          # 中文在这个 shell 里会被按 OEM 代码页解码成乱码：断言只用 ASCII 标记。
          if (($docObj.notes -join " ") -notmatch "GPULEASE_SMI") { throw "doctor must disclose that GPU data came from the stand-in command" }
          Write-Host "doctor discloses the stand-in command"

          Remove-Item Env:GPULEASE_SMI -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_SMI_SCENARIO -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_HOME -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      - name: queue dispatch against the exe（排队 → 自己上卡）
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # 用双卡替身：卡 0 剩 6330 MB（够 4 GB），卡 1 剩 4987 MB。20 GB 的活哪张都放不下。
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $fixture = (Resolve-Path test/fixture/smi.ts).Path
          if ($env:BUN_EXE -match "\s" -or $fixture -match "\s") {
            throw "GPULEASE_SMI 用空格切参数，路径不能含空格：$env:BUN_EXE | $fixture"
          }
          $env:GPULEASE_SMI = "$env:BUN_EXE $fixture"
          $env:GPULEASE_SMI_SCENARIO = "two-gpu"
          $env:GPULEASE_HOME = Join-Path $env:RUNNER_TEMP "gpulease-queue-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $env:GPULEASE_HOME | Out-Null

          & $exe submit --name q-fit --need-vram 4096 -- cmd /c echo queue-ran
          if ($LASTEXITCODE -ne 0) { throw "submit q-fit exited $LASTEXITCODE" }
          & $exe submit --name q-wait --need-vram 20000 -- cmd /c echo never
          if ($LASTEXITCODE -ne 0) { throw "submit q-wait exited $LASTEXITCODE" }

          # 值班进程要真常驻：`--once` 会立刻退出，Windows 上它刚起的 run 可能跟着被收走。
          $daemon = Start-Process -FilePath $exe -ArgumentList @('daemon', '--interval', '1000', '--quiet') -PassThru -WindowStyle Hidden

          function Get-Queue {
            return ((& $exe queue --json 2>&1 | Out-String) | ConvertFrom-Json)
          }

          $fit = Get-Queue | Where-Object { $_.name -eq "q-fit" }
          $wait = Get-Queue | Where-Object { $_.name -eq "q-wait" }
          if ($null -eq $fit) { throw "q-fit missing from the queue" }
          # daemon 是异步的，先给它几秒把 q-fit 放上卡 0，别抢在它前面读。
          for ($i = 0; $i -lt 30 -and $fit.gpu -ne 0; $i++) {
            Start-Sleep -Milliseconds 500
            $fit = Get-Queue | Where-Object { $_.name -eq "q-fit" }
          }
          if ($fit.gpu -ne 0) { throw "q-fit must land on card 0 (the only card with enough free vram), got $($fit.gpu)" }
          # 同一轮里值班才会给放不下的活写理由，重新读一次，别拿排到卡之前的快照断言。
          $wait = Get-Queue | Where-Object { $_.name -eq "q-wait" }
          if ($null -eq $wait) { throw "q-wait missing from the queue" }
          if ($wait.state -ne "queued") { throw "q-wait needs 20 GB and cannot fit; state must stay queued, got $($wait.state)" }
          if ([string]::IsNullOrWhiteSpace($wait.reason)) { throw "q-wait must carry the reason it is waiting" }
          Write-Host "queue: q-fit placed on card 0, q-wait explains why it waits"

          for ($i = 0; $i -lt 30; $i++) {
            $fit = Get-Queue | Where-Object { $_.name -eq "q-fit" }
            if ($fit.state -eq "done") { break }
            Start-Sleep -Seconds 2
          }
          if ($fit.state -ne "done") { throw "q-fit did not finish, state=$($fit.state)" }
          if ($null -eq $fit.run_id) { throw "q-fit finished without a run_id" }
          $logs = Join-Path $env:GPULEASE_HOME "logs"
          if (-not (Select-String -Path (Join-Path $logs "*.log") -Pattern "queue-ran" -Quiet)) {
            throw "the queued command never actually ran (no queue-ran in logs)"
          }
          Write-Host "queue: queued command really ran, run_id=$($fit.run_id)"
          if (-not $daemon.HasExited) { Stop-Process -Id $daemon.Id -Force }

          Remove-Item Env:GPULEASE_SMI -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_SMI_SCENARIO -ErrorAction SilentlyContinue

      - name: progress from a live run（进度只认日志里的证据）
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # 真起一个会打 tqdm 行的子进程，再从 exe 的 ls --json 里确认读到了进度。
          # 子进程靠 "停" 文件退出：Windows 上 stop 掉包装器不会顺带杀掉子进程。
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $home2 = Join-Path $env:RUNNER_TEMP "gpulease-prog-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:GPULEASE_HOME = $home2
          $stop = Join-Path $home2 "stop"
          $env:GPULEASE_STOP_FILE = $stop
          $child = Join-Path $home2 "child.ts"
          @(
            'import { existsSync } from "node:fs";'
            'console.log(" 42%|####      | 420/1000 [00:31<00:47, 9.8it/s]");'
            'while (!existsSync(process.env.GPULEASE_STOP_FILE!)) await Bun.sleep(500);'
          ) | Set-Content -Path $child -Encoding ASCII

          $proc = Start-Process -FilePath $exe -ArgumentList @('run','--name','prog','--',$env:BUN_EXE,$child) -PassThru -WindowStyle Hidden
          $hit = $null
          try {
            for ($i = 0; $i -lt 12; $i++) {
              Start-Sleep -Seconds 2
              $raw = & $exe ls --json 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) { throw "ls --json exited $LASTEXITCODE (progress)" }
              $state2 = $raw | ConvertFrom-Json
              $task = $state2.tasks | Where-Object { $_.run.name -eq 'prog' } | Select-Object -First 1
              if ($task -and $task.progress) {
                $hit = $task
                # 人读那行必须在这个任务还活着的当口取：任务一结束，进度就按设计消失了。
                $text = & $exe ls --no-color 2>&1 | Out-String
                break
              }
            }
          } finally {
            New-Item -ItemType File -Force -Path $stop | Out-Null
            Start-Sleep -Seconds 2
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          if (-not $hit) { throw "no progress was read from the live run" }
          if ($hit.progress.percent -ne 42) { throw "percent was $($hit.progress.percent), expected 42" }
          if ($hit.progress.label -ne '420/1000') { throw "label was $($hit.progress.label), expected 420/1000" }
          if ($hit.progress.eta_sec -ne 47) { throw "eta was $($hit.progress.eta_sec), expected 47" }
          if ($text -notmatch '42%') { throw "human output does not show 42 percent" }
          Write-Host "progress: percent 42, label 420/1000, eta 47s, visible in human output"

          Remove-Item Env:GPULEASE_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_STOP_FILE -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      - name: history across daemon restarts（占用率历史真的落到库里）
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # 两次 --once 之间隔过 15 秒采样下限：历史必须跨进程重启累积，
          # 否则"曲线"只是内存里的东西，值班一重启就归零。
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $fixture = (Resolve-Path test/fixture/smi.ts).Path
          $env:GPULEASE_SMI = "$env:BUN_EXE $fixture"
          $env:GPULEASE_SMI_SCENARIO = "two-gpu"
          $env:GPULEASE_HOME = Join-Path $env:RUNNER_TEMP "gpulease-hist-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $env:GPULEASE_HOME | Out-Null

          & $exe daemon --once --quiet
          if ($LASTEXITCODE -ne 0) { throw "first daemon --once exited $LASTEXITCODE (history)" }
          Start-Sleep -Seconds 16
          & $exe daemon --once --quiet
          if ($LASTEXITCODE -ne 0) { throw "second daemon --once exited $LASTEXITCODE (history)" }

          $raw = & $exe history --minutes 30 --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "history --json exited $LASTEXITCODE" }
          $hist = $raw | ConvertFrom-Json
          if ($null -eq $hist) { throw "history --json did not parse" }
          if ($hist.ticks -lt 2) { throw "history ticks was $($hist.ticks), expected at least 2 across restarts" }
          if ($hist.gpus.Count -lt 2) { throw "history covered $($hist.gpus.Count) cards, expected 2" }
          $g0 = $hist.gpus | Where-Object { $_.index -eq 0 } | Select-Object -First 1
          if (-not $g0) { throw "history has no card 0" }
          if ($g0.util.points -lt 2) { throw "card 0 has $($g0.util.points) util points, expected 2" }
          if ($g0.util.spark.Length -ne 24) { throw "spark length was $($g0.util.spark.Length), expected 24" }
          # 替身卡 0 是 97%，峰值断言防止把显存占比糊到占用上。
          if ($g0.util.peak -lt 90) { throw "card 0 util peak was $($g0.util.peak), expected around 97" }
          $text = & $exe history --no-color 2>&1 | Out-String
          if ($text -notmatch 'GPU 0') { throw "human history output does not name card 0" }
          Write-Host "history: ticks=$($hist.ticks), card0_points=$($g0.util.points), spark=$($g0.util.spark), peak=$($g0.util.peak)"
          Write-Host "history: card0 vram now $($g0.vram_used_gb) / $($g0.vram_total_gb) GB"

          Remove-Item Env:GPULEASE_HOME -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_SMI -ErrorAction SilentlyContinue
          Remove-Item Env:GPULEASE_SMI_SCENARIO -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      - name: perf budget（值班自己的开销，数字难看就是难看）
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # 每 2 秒一轮跑 20 秒：比默认 5 秒更密，占比只会更高。
          # 这台节点没有显卡、进程层只到 partial，慢是正常的；这里卡的是"别把监控做成负担"。
          $exe = (Resolve-Path dist/gpulease.exe).Path
          $env:GPULEASE_HOME = Join-Path $env:RUNNER_TEMP "gpulease-soak-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $env:GPULEASE_HOME | Out-Null
          $raw = & $exe doctor --soak --seconds 20 --json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "doctor --soak exited $LASTEXITCODE" }
          $soak = $raw | ConvertFrom-Json
          if ($null -eq $soak) { throw "doctor --soak did not parse" }
          if ($soak.seconds -lt 18) { throw "soak ran $($soak.seconds)s, expected at least 18s" }
          if ($soak.ticks -lt 3) { throw "soak ran only $($soak.ticks) ticks in $($soak.seconds)s" }
          if ($soak.rss_mb -ge 250) { throw "soak rss was $($soak.rss_mb) MB, budget is under 250 MB" }
          if ($soak.peak_rss_mb -ge 350) { throw "soak peak rss was $($soak.peak_rss_mb) MB, budget is under 350 MB" }
          if ($soak.cpu_pct -gt 40) { throw "soak cpu was $($soak.cpu_pct) percent at a 2s interval, budget is under 40" }
          Write-Host "perf: ticks=$($soak.ticks), tick_avg=$($soak.avg_tick_ms)ms, tick_max=$($soak.max_tick_ms)ms, cpu=$($soak.cpu_pct)%, rss=$($soak.rss_mb)MB, peak=$($soak.peak_rss_mb)MB"

          Remove-Item Env:GPULEASE_HOME -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

      - name: diagnose subprocess layer
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1 -ExpandProperty FullName
          $out = & $exe doctor --probe --json 2>&1
          $obj = ($out | Out-String) | ConvertFrom-Json
          Write-Host "process_layer=$($obj.wmi) detail=$($obj.wmi_detail)"
          foreach ($r in $obj.probe) {
            Write-Host ("probe {0}: code={1} timedOut={2} ms={3} bytes={4} err={5}" -f $r.label, $r.code, $r.timedOut, $r.ms, $r.out_bytes, $r.err_head)
          }
          $global:LASTEXITCODE = 0

      - name: pack zip
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $exe = (Resolve-Path dist/gpulease.exe).Path
          Compress-Archive -Path $exe -DestinationPath dist/gpulease-windows-x64.zip -Force
          $z = Get-Item dist/gpulease-windows-x64.zip
          $e = Get-Item $exe
          Write-Host ("exe_bytes={0} size_mb={1}" -f $e.Length, [math]::Round($e.Length/1MB,1))
          Write-Host ("zip_bytes={0} zip_mb={1}" -f $z.Length, [math]::Round($z.Length/1MB,1))

      - name: checksum
        if: hashFiles('package.json') != ''
        shell: powershell
        run: |
          $lines = @()
          foreach ($f in @("gpulease.exe", "gpulease-windows-x64.zip")) {
            $p = "dist/$f"
            if (Test-Path $p) {
              $h = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
              $lines += "$h  $f"
            }
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt | Write-Host

      - name: publish release
        if: hashFiles('package.json') != '' && startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          Get-Content dist/SHA256SUMS.txt | Write-Host
          $notes = ".github/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "缺少发布说明 $notes" }
          gh release create $tag dist/gpulease-windows-x64.zip dist/SHA256SUMS.txt --title "gpulease $tag" --notes-file $notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: upload artifact
        if: hashFiles('package.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gpulease-windows-x64
          path: |
            dist/gpulease-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: scaffold only
        if: hashFiles('package.json') == ''
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
        run: Write-Host "no package.json yet - the gate has nothing to build"

